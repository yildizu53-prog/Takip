name: Telegram bildirim testi

on:
  workflow_dispatch:

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    steps:
      - name: Telegram test mesajı gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests
          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat_id = os.environ["TELEGRAM_CHAT_ID"].strip()
          if not token or not chat_id:
              raise SystemExit("Telegram secrets eksik.")
          response = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={"chat_id": chat_id, "text": "✅ Adliye Duyuru Takip: Telegram bildirim testi başarılı!"},
              timeout=20,
          )
          response.raise_for_status()
          if not response.json().get("ok"):
              raise SystemExit("Telegram API mesajı kabul etmedi.")
          print("Telegram test mesajı başarıyla gönderildi.")
          PY
